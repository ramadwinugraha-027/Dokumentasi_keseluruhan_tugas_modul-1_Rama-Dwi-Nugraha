<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilihan Paket Lokakarya - D3 Teknik Informatika</title>
    <link rel="stylesheet" href="css/pricing.css">
</head>
<body>
    
    <main>
        <section class="pricing" aria-labelledby="pricing-title">
            <div class="container">
                <h2 id="pricing-title">Pilihan Paket Lokakarya</h2>

                <div class="pricing-list">
                    <article class="price-card">
                        <h3>Mandiri</h3>
                        <p class="price">Gratis</p>
                        <ul>
                            <li>Materi dasar</li>
                            <li>Latihan Mandiri</li>
                        </ul>
                        <a class="button" href="#daftar">Pilih Paket</a>
                    </article>

                    <article class="price-card price-card--featured">
                        <p class="badge">Rekomendasi</p>
                        <h3>Terbimbing</h3>
                        <p class="price">Rp150.000</p>
                        <ul>
                            <li>Materi dasar</li>
                            <li>Review tugas</li>
                            <li>Code defense</li>
                        </ul>
                        <a class="button" href="#daftar">Pilih Paket</a>
                    </article>

                    <article class="price-card">
                        <h3>Intensif</h3>
                        <p class="price">Rp250.000</p>
                        <ul>
                            <li>Semua fasilitas</li>
                            <li>Konsultasi tambahan</li>
                        </ul>
                        <a class="button" href="#daftar">Pilih Paket</a>
                    </article>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
