<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1">
    <title>Eksperimen Asynchronous JavaScript</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <section class="praktikum-card"
             aria-labelledby="judul-utama">
        <p class="label">Eksperimen 4</p>
        <h1 id="judul-utama">Async Data Loader</h1>
        <p id="status" class="status" data-state="idle"
             role="status" aria-live="polite">
             Belum ada proses.
        </p>
        <button id="muat-data" type="button">
             Muat data
        </button>
        <section id="daftar-fitur" class="grid"
             aria-label="Daftar fitur"></section>
        </section>
    </main>
    <script src="js/app.js" defer></script>
</body>
</html>
